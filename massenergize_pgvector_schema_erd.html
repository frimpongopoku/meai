<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  ACTIONS ||--o{ TESTIMONIALS : "linked via related_action"
  ACTIONS ||--o{ EMBEDDINGS : "has chunks"
  TESTIMONIALS ||--o{ EMBEDDINGS : "has chunks"
  EVENTS ||--o{ EMBEDDINGS : "has chunks"

  ACTIONS {
    uuid id PK
    int site_id
    int wp_post_id
    string title
    text description_html
    text description_text
    text steps_to_take_html
    text steps_to_take_text
    text deep_dive_html
    text deep_dive_text
    bool is_featured
    int display_order
    string category
    string sub_category
    string url
    string status
    timestamp modified_at
    string content_hash
    timestamp ingested_at
  }

  TESTIMONIALS {
    uuid id PK
    int site_id
    int wp_post_id
    string title
    text body_html
    text body_text
    string submitted_by
    string display_name
    int related_action_wp_post_id
    uuid related_action_id FK
    int display_order
    string status
    timestamp modified_at
    string content_hash
    timestamp ingested_at
  }

  EVENTS {
    uuid id PK
    int site_id
    int wp_post_id
    string title
    text description_html
    text description_text
    timestamp start_datetime_utc
    timestamp end_datetime_utc
    timestamp start_datetime_local
    timestamp end_datetime_local
    string timezone
    string venue_name
    string venue_address
    string organizer_names
    string organizer_emails
    string event_url
    string cost
    string status
    timestamp modified_at
    string content_hash
    timestamp ingested_at
  }

  EMBEDDINGS {
    uuid id PK
    string content_type
    uuid content_id
    int site_id
    int chunk_index
    text chunk_text
    vector embedding
    string embedding_model
    timestamp created_at
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
